# Nango self-hosted, deployed alongside AppLeap RAG on the GCP VM.
#
# This is a starting point — verify against the current docs at
# docs.nango.dev/host/self-host/local before deploying. Image tags and env
# variable names occasionally change between Nango releases.
#
# Bring up:    docker compose --env-file .env up -d
# Tail logs:   docker compose logs -f nango-server
# Tear down:   docker compose down              # keeps the volume
#              docker compose down -v           # nukes Nango's internal DB

version: "3.9"

services:
  nango-server:
    image: nangohq/nango-server:hosted
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"   # Dashboard / API (Nango listens on 8080 inside).
      - "127.0.0.1:3009:3009"   # Connect UI (the OAuth popup origin — served
                                # by the same container when FLAG_SERVE_CONNECT_UI=true).
                                # Both bound to localhost; Cloudflare Tunnel exposes them.
    environment:
      NANGO_DB_HOST: nango-db
      NANGO_DB_PORT: "5432"
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_NAME: nango
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY}        # base64-encoded 32 bytes
      NANGO_SERVER_URL: ${NANGO_SERVER_URL}                # API origin (public URL via Cloudflare Tunnel)
      # Frontend/dashboard origin. SEPARATE from NANGO_SERVER_URL — defaults
      # to http://localhost:3000, which breaks OAuth completion (browser
      # can't reach the user's localhost after Google's redirect). For a
      # single-origin deployment we point both at the same hostname.
      NANGO_PUBLIC_SERVER_URL: ${NANGO_SERVER_URL}
      # Connect UI public origin — yet another URL knob. Defaults to
      # http://localhost:3009 (the Connect UI's internal port), which fails
      # in the browser on a remote VM. Set to a Cloudflare-fronted hostname
      # that tunnels to localhost:3009 on the VM.
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL}
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_CONNECT_UI_PORT: "3009"
      # Enables the "scripts" feature flag, which unlocks deploying pre-built
      # Sync scripts (otherwise the UI greys out the Deploy button). The flag
      # is a plain env-var check in Nango's source — no license validation —
      # so flipping it on a self-host stays within ELv2 (internal use only).
      NANGO_ENTERPRISE: "true"
      NANGO_SERVER_WEBSOCKETS_PATH: ""
      LOG_LEVEL: info
    depends_on:
      nango-db:
        condition: service_healthy

  nango-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD}
      POSTGRES_DB: nango
    volumes:
      - nango-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango -d nango"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nango-db-data:
